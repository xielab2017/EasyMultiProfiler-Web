<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --accent: #2563eb;
    --accent2: #60a5fa;
    --ink: #0f172a;
    --muted: #64748b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f6f8fc;
    color: var(--ink);
    position: relative;
  }
  /* floating background blobs */
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .35; animation: float 14s ease-in-out infinite; }
  .blob.b1 { width: 460px; height: 460px; background: var(--accent2); top: -160px; right: -120px; }
  .blob.b2 { width: 380px; height: 380px; background: #c4b5fd; bottom: -160px; left: -120px; animation-delay: -5s; }
  @keyframes float { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,-26px)} }

  .stage { position: absolute; inset: 0; }

  header.bar {
    position: absolute; top: 34px; left: 56px; right: 56px;
    display: flex; align-items: center; justify-content: space-between; z-index: 5;
  }
  .chip {
    background: var(--accent); color: #fff; font-weight: 700; font-size: 22px;
    padding: 8px 18px; border-radius: 999px; letter-spacing: .5px;
    box-shadow: 0 8px 24px rgba(37,99,235,.28);
  }
  .brand { color: var(--muted); font-size: 18px; font-weight: 600; }

  .progress-wrap { position: absolute; left: 0; bottom: 0; width: 100%; height: 6px; background: rgba(15,23,42,.06); z-index: 5; }
  .progress { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }

  .footnote { position: absolute; left: 56px; bottom: 22px; color: var(--muted); font-size: 16px; z-index: 5; }

  .scene {
    position: absolute; inset: 0; padding: 110px 64px 70px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center;
    opacity: 0; transform: translateX(40px); pointer-events: none;
  }
  .scene.full { grid-template-columns: 1fr; text-align: center; }
  .scene.in { animation: sceneIn .7s cubic-bezier(.22,.9,.31,1) forwards; }
  .scene.out { animation: sceneOut .5s ease forwards; }
  @keyframes sceneIn { to { opacity: 1; transform: translateX(0); } }
  @keyframes sceneOut { to { opacity: 0; transform: translateX(-44px); } }

  .col-text { max-width: 560px; }
  .full .col-text { margin: 0 auto; }
  .eyebrow { color: var(--accent); font-weight: 800; font-size: 22px; margin-bottom: 14px; opacity: 0; }
  .scene.in .eyebrow { animation: rise .6s .05s forwards; }
  h1 { font-size: 52px; line-height: 1.18; font-weight: 800; letter-spacing: -.5px; opacity: 0; }
  .full h1 { font-size: 60px; }
  .scene.in h1 { animation: rise .7s .12s forwards; }
  h2 { font-size: 40px; line-height: 1.25; font-weight: 800; letter-spacing: -.3px; opacity: 0; }
  .scene.in h2 { animation: rise .7s .1s forwards; }
  .subtitle { font-size: 26px; color: var(--muted); margin-top: 18px; line-height: 1.5; opacity: 0; }
  .scene.in .subtitle { animation: rise .7s .25s forwards; }
  @keyframes rise { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }

  ul.points { list-style: none; margin-top: 26px; }
  ul.points li {
    font-size: 27px; line-height: 1.5; margin: 16px 0; padding-left: 40px; position: relative;
    opacity: 0; transform: translateY(16px);
  }
  ul.points li::before {
    content: ""; position: absolute; left: 0; top: 12px; width: 18px; height: 18px;
    border-radius: 6px; background: linear-gradient(135deg, var(--accent), var(--accent2));
  }
  .scene.in ul.points li { animation: rise .55s forwards; }
  .scene.in ul.points li:nth-child(1){animation-delay:.35s}
  .scene.in ul.points li:nth-child(2){animation-delay:.6s}
  .scene.in ul.points li:nth-child(3){animation-delay:.85s}
  .scene.in ul.points li:nth-child(4){animation-delay:1.1s}

  .visual { display: flex; align-items: center; justify-content: center; }
  svg { width: 100%; max-width: 520px; height: auto; overflow: visible; }

  /* generic draw-in helpers */
  .pop { opacity: 0; transform: scale(.6); transform-origin: center; }
  .scene.in .pop { animation: pop .5s cubic-bezier(.2,1.2,.3,1) forwards; }
  @keyframes pop { to { opacity: 1; transform: scale(1); } }
  .grow { transform: scaleY(0); transform-origin: bottom; }
  .scene.in .grow { animation: grow .7s cubic-bezier(.2,.9,.3,1) forwards; }
  @keyframes grow { to { transform: scaleY(1); } }
  .draw { stroke-dasharray: 600; stroke-dashoffset: 600; }
  .scene.in .draw { animation: draw 1s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .fadein { opacity: 0; }
  .scene.in .fadein { animation: fadein .6s forwards; }
  @keyframes fadein { to { opacity: 1; } }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="stage" id="stage"></div>
  <header class="bar"><span class="chip" id="chip">步骤</span><span class="brand">EasyMultiProfiler · 背景微课</span></header>
  <div class="footnote" id="foot">原创动画讲解 · 中文配音</div>
  <div class="progress-wrap"><div class="progress" id="prog"></div></div>

<script>
const DATA = /*__DATA__*/;
const ACCENTS = {
  microbiome_16s: ["#2563eb","#60a5fa"],
  transcriptomics: ["#059669","#34d399"],
  metabolomics: ["#c026d3","#e879f9"],
  metagenomics: ["#ea580c","#fb923c"],
};

function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}

function svgFlow(items){
  const n=items.length, W=520, boxW=Math.min(150,(W-20)/n*0.86), gap=(W-boxW*n)/(n-1||1), H=120;
  let parts=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<n;i++){
    const x=i*(boxW+gap), y=30;
    parts+=`<g class="pop" style="animation-delay:${.3+i*0.35}s">
      <rect x="${x}" y="${y}" rx="12" width="${boxW}" height="58" fill="url(#g)" />
      <text x="${x+boxW/2}" y="${y+35}" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">${esc(items[i])}</text></g>`;
    if(i<n-1){const ax=x+boxW+4, ay=y+29;
      parts+=`<line class="draw" style="animation-delay:${.5+i*0.35}s" x1="${ax}" y1="${ay}" x2="${ax+gap-8}" y2="${ay}" stroke="#94a3b8" stroke-width="4" marker-end="url(#arr)"/>`;}
  }
  parts+=defs()+`</svg>`; return parts;
}
function svgBars(vals,labels){
  const W=520,H=300,n=vals.length, bw=Math.min(70,(W-60)/n*0.7), gap=(W-60-bw*n)/(n-1||1), max=Math.max(...vals), base=H-50;
  let p=`<svg viewBox="0 0 ${W} ${H}">`;
  p+=`<line x1="40" y1="${base}" x2="${W-10}" y2="${base}" stroke="#cbd5e1" stroke-width="3"/>`;
  for(let i=0;i<n;i++){const h=(vals[i]/max)*(base-30), x=50+i*(bw+gap);
    p+=`<rect class="grow" style="animation-delay:${.3+i*0.18}s" x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="6" fill="url(#g)"/>`;
    if(labels&&labels[i])p+=`<text class="fadein" style="animation-delay:${.6+i*0.18}s" x="${x+bw/2}" y="${base+26}" text-anchor="middle" font-size="18" fill="#475569">${esc(labels[i])}</text>`;}
  p+=defs()+`</svg>`;return p;
}
function svgTable(){
  const W=520,H=300,cols=4,rows=4,cw=110,ch=52,x0=40,y0=20;
  let p=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=x0+c*cw,y=y0+r*ch, head=r===0||c===0;
    p+=`<rect class="pop" style="animation-delay:${.25+(r+c)*0.1}s" x="${x}" y="${y}" width="${cw-6}" height="${ch-6}" rx="6" fill="${head?'url(#g)':'#fff'}" stroke="#e2e8f0"/>`;
    if(head)p+=`<text x="${x+(cw-6)/2}" y="${y+(ch-6)/2+6}" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">${r===0?(c===0?'':'样本'+c):'taxa'+r}</text>`;
    else p+=`<text class="fadein" style="animation-delay:${.5+(r+c)*0.1}s" x="${x+(cw-6)/2}" y="${y+(ch-6)/2+6}" text-anchor="middle" fill="#334155" font-size="16">${Math.floor(Math.random()*90)}</text>`;}
  p+=defs()+`</svg>`;return p;
}
function svgScatter(){
  const W=520,H=320;let p=`<svg viewBox="0 0 ${W} ${H}">`;
  p+=`<line x1="50" y1="${H-40}" x2="${W-20}" y2="${H-40}" stroke="#cbd5e1" stroke-width="3"/><line x1="50" y1="20" x2="50" y2="${H-40}" stroke="#cbd5e1" stroke-width="3"/>`;
  const cl=[[150,120,'#2563eb'],[360,210,'#f97316']];
  cl.forEach((c,ci)=>{for(let i=0;i<10;i++){const a=Math.random()*6.28,r=Math.random()*55;
    p+=`<circle class="pop" style="animation-delay:${.3+ci*0.4+i*0.05}s" cx="${c[0]+Math.cos(a)*r}" cy="${c[1]+Math.sin(a)*r}" r="9" fill="${c[2]}" opacity=".82"/>`;}});
  p+=`</svg>`;return p;
}
function svgVolcano(){
  const W=520,H=320;let p=`<svg viewBox="0 0 ${W} ${H}">`;
  p+=`<line x1="40" y1="${H-36}" x2="${W-20}" y2="${H-36}" stroke="#cbd5e1" stroke-width="3"/><line x1="${W/2}" y1="16" x2="${W/2}" y2="${H-36}" stroke="#e2e8f0" stroke-dasharray="6" stroke-width="2"/>`;
  for(let i=0;i<46;i++){const x=40+Math.random()*(W-60), d=(x-W/2)/(W/2);
    const y=H-40-Math.abs(d)*Math.random()*220-Math.random()*20;
    const col=Math.abs(d)>0.45&&y<160?(d<0?'#2563eb':'#ef4444'):'#cbd5e1';
    p+=`<circle class="pop" style="animation-delay:${.2+i*0.025}s" cx="${x}" cy="${y}" r="7" fill="${col}" opacity=".82"/>`;}
  p+=`</svg>`;return p;
}
function svgFunnel(steps){
  steps=steps||["原始","过滤","标准化"];const W=520,H=300,n=steps.length;let p=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<n;i++){const w=380-i*90, x=(W-w)/2, y=30+i*80;
    p+=`<rect class="pop" style="animation-delay:${.3+i*0.3}s" x="${x}" y="${y}" width="${w}" height="56" rx="10" fill="url(#g)" opacity="${1-i*0.18}"/>
        <text x="${W/2}" y="${y+35}" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">${esc(steps[i])}</text>`;}
  p+=defs()+`</svg>`;return p;
}
function svgHeatmap(){
  const W=480,H=320,cols=8,rows=6,cw=W/cols,ch=H/rows;let p=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const v=Math.random();
    const col=`rgb(${Math.floor(255-v*200)},${Math.floor(255-v*120)},${Math.floor(120+v*100)})`;
    p+=`<rect class="pop" style="animation-delay:${.2+(r+c)*0.06}s" x="${c*cw}" y="${r*ch}" width="${cw-3}" height="${ch-3}" rx="3" fill="${col}"/>`;}
  p+=`</svg>`;return p;
}
function svgNetwork(){
  const W=480,H=320,nodes=[[240,60],[120,160],[360,160],[180,270],[320,270],[240,180]];let p=`<svg viewBox="0 0 ${W} ${H}">`;
  const edges=[[0,5],[1,5],[2,5],[3,5],[4,5],[1,3],[2,4]];
  edges.forEach((e,i)=>{p+=`<line class="draw" style="animation-delay:${.3+i*0.12}s" x1="${nodes[e[0]][0]}" y1="${nodes[e[0]][1]}" x2="${nodes[e[1]][0]}" y2="${nodes[e[1]][1]}" stroke="#cbd5e1" stroke-width="3"/>`;});
  nodes.forEach((nd,i)=>{p+=`<circle class="pop" style="animation-delay:${.5+i*0.1}s" cx="${nd[0]}" cy="${nd[1]}" r="${i===5?26:20}" fill="url(#g)"/>`;});
  p+=defs()+`</svg>`;return p;
}
function svgCheck(items){
  items=items||["要点"];const W=520;let p=`<svg viewBox="0 0 ${W} ${items.length*70+20}">`;
  items.forEach((t,i)=>{const y=20+i*70;
    p+=`<g class="pop" style="animation-delay:${.3+i*0.3}s"><circle cx="34" cy="${y+18}" r="24" fill="url(#g)"/>
       <path d="M22 ${y+18} l8 9 l16 -18" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
       <text x="74" y="${y+26}" font-size="24" fill="#334155" font-weight="600">${esc(t)}</text></g>`;});
  p+=defs()+`</svg>`;return p;
}
function defs(){return `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#94a3b8"/></marker></defs>`;}

function buildVisual(v){
  if(!v||!v.type) return "";
  switch(v.type){
    case "flow": return svgFlow(v.items||["A","B","C"]);
    case "bars": return svgBars(v.values||[3,6,4,8,5], v.labels);
    case "table": return svgTable();
    case "scatter": return svgScatter();
    case "volcano": return svgVolcano();
    case "funnel": return svgFunnel(v.items);
    case "heatmap": return svgHeatmap();
    case "network": return svgNetwork();
    case "check": return svgCheck(v.items);
    default: return "";
  }
}

function buildScene(s, isTitle){
  const div=document.createElement('div');
  div.className='scene'+((isTitle||!s.visual)?' full':'');
  const txt=document.createElement('div'); txt.className='col-text';
  if(isTitle){
    txt.innerHTML=`<div class="eyebrow">${esc(s.eyebrow||'')}</div><h1>${esc(s.heading||'')}</h1>${s.subtitle?`<p class="subtitle">${esc(s.subtitle)}</p>`:''}`;
  }else{
    let pts = (s.points||[]).map(p=>`<li>${esc(p)}</li>`).join('');
    txt.innerHTML=`${s.eyebrow?`<div class="eyebrow">${esc(s.eyebrow)}</div>`:''}<h2>${esc(s.heading||'')}</h2>${pts?`<ul class="points">${pts}</ul>`:''}`;
  }
  div.appendChild(txt);
  if(!isTitle && s.visual){const vz=document.createElement('div'); vz.className='visual'; vz.innerHTML=buildVisual(s.visual); div.appendChild(vz);}
  return div;
}

function run(){
  const acc=ACCENTS[DATA.omics]||ACCENTS.microbiome_16s;
  document.documentElement.style.setProperty('--accent',acc[0]);
  document.documentElement.style.setProperty('--accent2',acc[1]);
  document.getElementById('chip').textContent=DATA.step_label||'';
  if(DATA.footnote) document.getElementById('foot').textContent=DATA.footnote;
  const stage=document.getElementById('stage');
  const scenes=DATA.scenes;
  const durs=DATA.durations; // seconds per scene
  const total=durs.reduce((a,b)=>a+b,0);
  const prog=document.getElementById('prog');
  const t0=performance.now();
  function tick(){const e=(performance.now()-t0)/1000; prog.style.width=Math.min(100,e/total*100)+'%'; if(e<total)requestAnimationFrame(tick);} 
  requestAnimationFrame(tick);

  let i=0, cur=null;
  function show(idx){
    const isTitle=idx===0 && DATA.title_first;
    const el=buildScene(scenes[idx], isTitle);
    stage.appendChild(el);
    // force reflow then animate in
    void el.offsetWidth; el.classList.add('in');
    cur=el;
    const ms=durs[idx]*1000;
    setTimeout(()=>{
      el.classList.remove('in'); el.classList.add('out');
      setTimeout(()=>{ el.remove(); }, 500);
      i++;
      if(i<scenes.length) show(i);
      else setTimeout(()=>{ window.__done=true; }, 400);
    }, ms);
  }
  show(0);
}

document.fonts.ready.then(()=>{ window.__ready=true; });
window.START=run;
</script>
</body>
</html>
