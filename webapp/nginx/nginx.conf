server {
    listen 80;
    server_name _;

    # ── Frontend (static files) ──────────────────
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(css|js|png|jpg|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Backend API (Plumber) ────────────────────
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;   # analyses can be slow
        proxy_send_timeout 600s;
        client_max_body_size 500M; # large omics files

        # CORS pass-through (backend also sets CORS headers)
        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Methods "GET,POST,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type,X-Session-Id" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;
}
