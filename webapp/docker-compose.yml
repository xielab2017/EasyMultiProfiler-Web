version: "3.9"

services:

  # ── R / Plumber REST API ──────────────────────────
  backend:
    build:
      context: ..             # repo root (so we can COPY the R package source)
      dockerfile: webapp/backend/Dockerfile
    container_name: emp_backend
    restart: unless-stopped
    ports:
      - "8000:8000"           # also exposed directly for debugging
    volumes:
      - emp_sessions:/tmp/emp_sessions   # persist sessions across restarts
    environment:
      - R_LIBS_USER=/usr/local/lib/R/library
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Nginx + Static Frontend ───────────────────────
  frontend:
    build:
      context: .              # webapp/ dir (has frontend/ and nginx/ subdirs)
      dockerfile: frontend/Dockerfile
    container_name: emp_frontend
    restart: unless-stopped
    ports:
      - "80:80"               # browse http://localhost
    depends_on:
      backend:
        condition: service_healthy

volumes:
  emp_sessions:
    driver: local
