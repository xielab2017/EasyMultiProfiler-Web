name: windows-validation

# Runs the portability and functional suites on a real Windows Server runner.
# Two jobs on purpose:
#   platform  - ~2 min, needs only jsonlite. Covers the Windows-specific paths
#               (%LOCALAPPDATA% data root, allow-list containment, ownership scan).
#   router    - ~20 min first run, ~4 min cached. Installs the full engine and drives
#               all 173 endpoints through the plumber router (no socket, no browser).
# The platform job is not a dependency of the router job: a dependency failure would
# hide the router result, and both are independently informative.

on:
  push:
    branches: ["v9.0.5", "v9.0.5-**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  platform:
    name: Windows portability checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"
          use-public-rspm: true

      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite")'

      - name: Run portability checks
        run: Rscript test_emp_web_platform.R --out windows_platform_report.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-platform-report
          path: windows_platform_report.csv

  router:
    name: Windows functional suite (173 endpoints)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"
          use-public-rspm: true

      # RSPM and Bioconductor both serve prebuilt Windows binaries, so this is a
      # download rather than a compile. The cache key is the DESCRIPTION file: any
      # dependency change invalidates it.
      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: win-r441-${{ hashFiles('DESCRIPTION') }}
          restore-keys: win-r441-

      - name: Install dependencies
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/latest"))
          if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager")
          d <- read.dcf("DESCRIPTION")
          strip <- function(x) {
            v <- trimws(gsub("[(].*?[)]", "", strsplit(x, ",")[[1]]))
            v[nzchar(v) & v != "R"]
          }
          need <- unique(c(strip(d[1, "Imports"]),
                           c("plumber", "jsonlite", "callr", "zip", "openxlsx", "httr2",
                             "pheatmap", "ragg", "base64enc", "RColorBrewer", "scales")))
          have <- rownames(installed.packages())
          miss <- setdiff(need, have)
          cat("missing:", length(miss), "\n")
          if (length(miss)) BiocManager::install(miss, ask = FALSE, update = FALSE)
          still <- setdiff(need, rownames(installed.packages()))
          if (length(still)) {
            cat("UNINSTALLABLE:", paste(still, collapse = " "), "\n")
            quit(status = 1)
          }

      - name: Install EasyMultiProfiler from this checkout
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      - name: Run the functional suite through the router
        run: Rscript test_emp_web_router.R --out windows_router_report.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-router-report
          path: windows_router_report.csv
