name: windows-validation

# Runs the portability and functional suites on a real Windows Server runner.
# Two jobs on purpose:
#   platform  - ~2 min, needs only jsonlite. Covers the Windows-specific paths
#               (%LOCALAPPDATA% data root, allow-list containment, ownership scan).
#   router    - ~20 min first run, ~4 min cached. Installs the full engine and drives
#               all 173 endpoints through the plumber router (no socket, no browser).
# The platform job is not a dependency of the router job: a dependency failure would
# hide the router result, and both are independently informative.

on:
  push:
    branches: ["v9.0.5", "v9.0.5-**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  platform:
    name: Windows portability checks
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # "release" rather than a pin: Boruta 10.0.0 imports fru (published 2026-08-20),
          # which has no Windows binary for older R minor versions, so a pinned 4.4.1 runner
          # cannot install the declared dependency set at all.
          r-version: "release"
          use-public-rspm: true

      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite")'

      - name: Run portability checks
        run: Rscript test_emp_web_platform.R --out windows_platform_report.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-platform-report
          path: windows_platform_report.csv

      - name: Report results as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          f=windows_platform_report.csv
          if [ -f "$f" ]; then
            { echo "### Windows portability checks (\`${{ runner.os }}\`, run ${{ github.run_id }})"; echo; echo '```'; cat "$f"; echo '```'; } > body.md
          else
            { echo "### Windows portability checks"; echo; echo "no report produced - the step failed before writing it"; } > body.md
          fi
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat body.md)" --silent


  router:
    name: Windows functional suite (173 endpoints)
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # "release" rather than a pin: Boruta 10.0.0 imports fru (published 2026-08-20),
          # which has no Windows binary for older R minor versions, so a pinned 4.4.1 runner
          # cannot install the declared dependency set at all.
          r-version: "release"
          use-public-rspm: true

      # RSPM and Bioconductor both serve prebuilt Windows binaries, so this is a
      # download rather than a compile. The cache key is the DESCRIPTION file: any
      # dependency change invalidates it.
      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: win-rrel-${{ hashFiles('DESCRIPTION') }}
          restore-keys: win-rrel-

      - name: Install dependencies
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/latest"))
          con <- file("install_diagnostics.txt", open = "wt")
          say <- function(...) { cat(..., "\n"); cat(..., "\n", file = con) }
          say("R", as.character(getRversion()), "|", R.version$platform)
          if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager")
          say("BiocManager", as.character(BiocManager::version()))
          d <- read.dcf("DESCRIPTION")
          strip <- function(x) {
            v <- trimws(gsub("[(].*?[)]", "", strsplit(x, ",")[[1]]))
            v[nzchar(v) & v != "R"]
          }
          need <- unique(c(strip(d[1, "Imports"]),
                           c("plumber", "jsonlite", "callr", "zip", "openxlsx", "httr2",
                             "pheatmap", "ragg", "base64enc", "RColorBrewer", "scales")))
          say("declared runtime packages:", length(need))
          miss <- setdiff(need, rownames(installed.packages()))
          say("missing at start:", length(miss))
          # One at a time, so a single unavailable package names itself instead of
          # taking the whole batch down with an unreadable error.
          failed <- character()
          for (p in miss) {
            notes <- character()
            ok <- withCallingHandlers(
              tryCatch({
                BiocManager::install(p, ask = FALSE, update = FALSE, quiet = TRUE)
                requireNamespace(p, quietly = TRUE)
              }, error = function(e) { notes <<- c(notes, paste("ERROR:", conditionMessage(e))); FALSE }),
              warning = function(w) { notes <<- c(notes, paste("WARN:", conditionMessage(w))); invokeRestart("muffleWarning") })
            if (!isTRUE(ok)) {
              failed <- c(failed, p)
              # A package usually fails because something it needs failed first. Name that,
              # otherwise the report says "3 packages failed" and hides the single root cause.
              deps <- tryCatch({
                db <- available.packages()
                d <- tools::package_dependencies(p, db = db, recursive = FALSE)[[1]]
                setdiff(d, rownames(installed.packages()))
              }, error = function(e) character())
              say("  FAILED", p)
              if (length(deps)) say("    missing dependencies:", paste(deps, collapse = " "))
              for (n in utils::head(notes, 3)) say("   ", substr(n, 1, 220))
            }
          }
          say("still missing:", length(failed))
          if (length(failed)) say("  ", paste(failed, collapse = " "))
          close(con)
          if (length(failed)) quit(status = 1)

      - name: Report dependency diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [ -f install_diagnostics.txt ] || exit 0
          { echo "### Windows dependency install (run ${{ github.run_id }})"; echo; echo '```'; cat install_diagnostics.txt; echo '```'; } > diag.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat diag.md)" --silent

      - name: Install EasyMultiProfiler from this checkout
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      - name: Run the functional suite through the router
        run: Rscript test_emp_web_router.R --out windows_router_report.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-router-report
          path: windows_router_report.csv

      - name: Report results as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          f=windows_router_report.csv
          if [ -f "$f" ]; then
            { echo "### Windows functional suite (\`${{ runner.os }}\`, run ${{ github.run_id }})"; echo; echo '```'; cat "$f"; echo '```'; } > body.md
          else
            { echo "### Windows functional suite"; echo; echo "no report produced - the step failed before writing it"; } > body.md
          fi
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat body.md)" --silent

